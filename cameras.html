<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fcfdff" />
    <meta name="description" content="My Orbit 2026 — Future Explorers Academy" />
    <title>Classroom cameras · Future Explorers Academy</title>
    <link rel="icon" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/logo.png" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/bootstrap-grid.min.css" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/main.min.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body class="">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app theme-home">
      <div class="shell">
        <header class="topbar">
          <a class="brand" href="index.html" aria-label="Future Explorers Academy — Home"
            ><img
              src="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/logo.png"
              alt="Future Explorers Academy"
              class=""
              decoding="async"
          /></a>
          <div class="topbar-actions">
            <a
              class="icon-button avatar-button"
              href="account.html"
              aria-label="Account information"
              ><img
                src="assets/img/christopher.webp"
                alt="Christopher Miller"
                class="avatar avatar-sm"
                decoding="async"
            /></a>
          </div>
        </header>
        <main class="main" id="main">
          <section class="greeting" aria-labelledby="greeting-title">
            <p>Good morning,</p>
            <h1 id="greeting-title">Christopher!</h1>
            <p>Here’s what’s happening today.</p>
          </section>
          <a class="child-card" href="profile.html"
            ><img
              data-child-avatar
              src="assets/img/emilia.webp"
              alt="Emilia Madariaga"
              class="avatar"
              decoding="async" />
            <div class="child-copy">
              <h2 data-child-name>Emilia Madariaga</h2>
              <p class="muted" data-child-group>Pre-K B</p>
            </div>
            <span class="chevron"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#chevron-right"></use></svg></span></a
          ><label class="search" for="camera-search"
            ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg
            ><span class="sr-only">Search cameras</span
            ><input
              type="search"
              id="camera-search"
              placeholder="Search cameras…"
              data-filter
              autocomplete="off"
          /></label>
          <p class="sr-only" data-filter-status role="status"></p>
          <ul class="camera-list row g-4" data-filter-list>
            <li class="col-12 col-md-6" data-search-item>
              <a href="classroom-1.html" class="camera-card panel"
                ><img
                  src="assets/img/camera-1.webp"
                  alt="Classroom 1 preview"
                  class=""
                  decoding="async" />
                <div>
                  <div class="camera-title">
                    <svg class="icon" aria-hidden="true">
                      <use href="assets/icons.svg#video"></use>
                    </svg>
                    <h2>Pre-K B-PreK-B1</h2>
                  </div>
                  <p>Classroom 1</p>
                  <span class="live">LIVE</span>
                </div>
                <span class="chevron"
                  ><svg class="icon" aria-hidden="true">
                    <use href="assets/icons.svg#chevron-right"></use></svg></span
              ></a>
            </li>
            <li class="col-12 col-md-6" data-search-item>
              <a href="classroom-2.html" class="camera-card panel"
                ><img
                  src="assets/img/camera-2.webp"
                  alt="Classroom 2 preview"
                  class=""
                  decoding="async" />
                <div>
                  <div class="camera-title">
                    <svg class="icon" aria-hidden="true">
                      <use href="assets/icons.svg#video"></use>
                    </svg>
                    <h2>Pre-K B-PreK-B2</h2>
                  </div>
                  <p>Classroom 2</p>
                  <span class="live">LIVE</span>
                </div>
                <span class="chevron"
                  ><svg class="icon" aria-hidden="true">
                    <use href="assets/icons.svg#chevron-right"></use></svg></span
              ></a>
            </li>
            <li class="col-12 col-md-6" data-search-item>
              <button
                type="button"
                data-action="open-camera"
                data-camera-id="3"
                aria-disabled="true"
                class="camera-card panel"
              >
                <img
                  src="assets/img/camera-3.webp"
                  alt="Classroom 3 preview"
                  class=""
                  decoding="async"
                />
                <div>
                  <div class="camera-title">
                    <svg class="icon" aria-hidden="true">
                      <use href="assets/icons.svg#video"></use>
                    </svg>
                    <h2>Pre-K A-PreK-A1</h2>
                  </div>
                  <p>Classroom 3</p>
                  <span class="live">LIVE</span>
                </div>
                <span class="chevron"
                  ><svg class="icon" aria-hidden="true">
                    <use href="assets/icons.svg#chevron-right"></use></svg
                ></span>
              </button>
            </li>
            <li class="col-12 col-md-6" data-search-item>
              <button
                type="button"
                data-action="open-camera"
                data-camera-id="4"
                aria-disabled="true"
                class="camera-card panel"
              >
                <img
                  src="assets/img/camera-4.webp"
                  alt="Classroom 4 preview"
                  class=""
                  decoding="async"
                />
                <div>
                  <div class="camera-title">
                    <svg class="icon" aria-hidden="true">
                      <use href="assets/icons.svg#video"></use>
                    </svg>
                    <h2>Toddler Room</h2>
                  </div>
                  <p>Classroom 4</p>
                  <span class="live">LIVE</span>
                </div>
                <span class="chevron"
                  ><svg class="icon" aria-hidden="true">
                    <use href="assets/icons.svg#chevron-right"></use></svg
                ></span>
              </button>
            </li>
          </ul>
        </main>
      </div>
    </div>
    <nav class="navbar-bottom" aria-label="Main navigation">
      <ul>
        <li>
          <a class="nav-link" href="index.html" aria-current="page"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#home"></use></svg></span
            ><span>Home</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="qr.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#qr"></use></svg></span
            ><span>My QR</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="chat.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#chat"></use></svg
              ><span class="notification-count" aria-label="2 unread messages">2</span></span
            ><span>Messages</span></a
          >
        </li>
      </ul>
    </nav>
  </body>
</html>
