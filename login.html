<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fcfdff" />
    <meta name="description" content="My Orbit 2026 — Future Explorers Academy" />
    <title>Login · Future Explorers Academy</title>
    <link rel="icon" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/logo.png" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/bootstrap-grid.min.css" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/main.min.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body class="">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app theme-flows">
      <div class="shell login-shell">
        <main class="login-preview" id="main">
          <section class="login-intro" aria-labelledby="login-slogan">
            <img
              src="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/logo.png"
              alt="Future Explorers Academy"
              class="login-logo"
              decoding="async"
            />
            <h1 id="login-slogan">Where learning takes flight!</h1>
            <div class="login-actions">
              <button type="button" class="button-primary">CREATE AN ACCOUNT</button
              ><button type="button" class="button-primary login-secondary">
                SCHEDULE A VISIT
              </button>
            </div>
          </section>
          <section class="login-card panel" aria-labelledby="login-title">
            <h2 id="login-title">Welcome back</h2>

            <form class="preview-form" autocomplete="off" onsubmit="return false">
              <label for="login-username">Username or Email Address</label
              ><input id="login-username" type="text" placeholder="Username or Email Address" />
              <label for="login-password">Password</label
              ><input id="login-password" type="password" placeholder="Password" />
              <button type="button" class="preview-text-button">Forgot password?</button>
              <button type="button" class="button-primary login-submit">SIGN IN</button>
            </form>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
