<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fcfdff" />
    <meta name="description" content="My Orbit 2026 — Future Explorers Academy" />
    <title>Activities · Future Explorers Academy</title>
    <link rel="icon" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/logo.png" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/bootstrap-grid.min.css" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/main.min.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body class="">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app theme-flows">
      <div class="shell">
        <header class="page-header">
          <a class="icon-button" href="profile.html" aria-label="Go back"
            ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#back"></use></svg
          ></a>
          <div class="header-title"><h1>Activities</h1></div>
          <span aria-hidden="true"></span>
        </header>
        <main class="main reading flow-main" id="main">
          <section class="mood-summary" aria-label="Activity summary">
            <div class="mood-count panel">
              <img src="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/happy.webp" alt="" class="mood-image" decoding="async" />
              <div>
                <h2>Happy</h2>
                <p>1 activity</p>
              </div>
            </div>
            <div class="mood-count panel">
              <img src="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/sad.webp" alt="" class="mood-image" decoding="async" />
              <div>
                <h2>Sad</h2>
                <p>1 activity</p>
              </div>
            </div>
          </section>
          <div class="activity-timeline">
            <article class="activity-entry panel">
              <h2 class="mood-label mood-happy">
                <img src="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/happy.webp" alt="" class="mood-image" decoding="async" />Happy
              </h2>
              <p class="activity-time">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#clock"></use></svg
                ><time datetime="10:58">10:58 AM</time>
              </p>
              <h3>Infant Tummy Time - test</h3>
              <div class="entry-teacher">
                <img src="assets/img/christopher.webp" alt="" class="avatar" decoding="async" />
                <div>
                  <p>Assigned by:</p>
                  <strong>Christopher Posada</strong>
                </div>
              </div>
            </article>
            <article class="activity-entry panel">
              <h2 class="mood-label mood-sad">
                <img src="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/sad.webp" alt="" class="mood-image" decoding="async" />Sad
              </h2>
              <p class="activity-time">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#clock"></use></svg
                ><time datetime="11:28">11:28 AM</time>
              </p>
              <h3>Breakfast - test</h3>
              <div class="entry-teacher">
                <img src="assets/img/christopher.webp" alt="" class="avatar" decoding="async" />
                <div>
                  <p>Assigned by:</p>
                  <strong>Christopher Posada</strong>
                </div>
              </div>
            </article>
          </div>
        </main>
      </div>
    </div>
    <nav class="navbar-bottom" aria-label="Main navigation">
      <ul>
        <li>
          <a class="nav-link" href="index.html" aria-current="page"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#home"></use></svg></span
            ><span>Home</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="qr.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#qr"></use></svg></span
            ><span>My QR</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="chat.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#chat"></use></svg
              ><span class="notification-count" aria-label="2 unread messages">2</span></span
            ><span>Messages</span></a
          >
        </li>
      </ul>
    </nav>
  </body>
</html>
