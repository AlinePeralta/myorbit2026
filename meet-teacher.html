<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fcfdff" />
    <meta name="description" content="My Orbit 2026 — Future Explorers Academy" />
    <title>Meet the Teacher · Future Explorers Academy</title>
    <link rel="icon" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/logo.png" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/bootstrap-grid.min.css" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/main.min.css" />
    <script src="js/app.js" defer></script>
    <script src="js/vendor/sweetalert2.all.min.js" defer></script>
    <script src="js/meeting.js" defer></script>
  </head>
  <body class="">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app theme-flows">
      <div class="shell">
        <header class="page-header">
          <a class="icon-button" href="profile.html" aria-label="Go back"
            ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#back"></use></svg
          ></a>
          <div class="header-title"><h1>Meet the Teacher</h1></div>
          <span aria-hidden="true"></span>
        </header>
        <main class="main reading flow-main" id="main">
          <form id="meeting-form" class="meeting-form panel">
            <div class="form-field">
              <label for="teacher">Teacher</label
              ><select id="teacher" name="teacher" required>
                <option value="" disabled selected>Choose teacher</option>
                <option>Christopher Posada</option>
                <option>Emily Sosa-Lopez</option>
                <option>Margaret Madariaga</option>
                <option>Brookiney Diao</option>
              </select>
            </div>
            <div class="form-field">
              <label for="description">Description</label
              ><textarea
                id="description"
                name="description"
                placeholder="Description"
                rows="3"
                maxlength="1000"
                required
              ></textarea>
            </div>
            <div class="row g-4">
              <div class="col-12 col-md-6 form-field">
                <label for="meeting-date">Date</label
                ><input type="date" id="meeting-date" name="date" required />
              </div>
              <div class="col-12 col-md-6 form-field">
                <label for="meeting-time">Time</label
                ><input type="time" id="meeting-time" name="time" required />
              </div>
            </div>
            <button
              class="button-primary meeting-submit"
              type="submit"
              data-action="request-meeting"
            >
              TALK TO THE TEACHER
            </button>
          </form>
        </main>
      </div>
    </div>
    <nav class="navbar-bottom" aria-label="Main navigation">
      <ul>
        <li>
          <a class="nav-link" href="index.html" aria-current="page"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#home"></use></svg></span
            ><span>Home</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="qr.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#qr"></use></svg></span
            ><span>My QR</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="chat.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#chat"></use></svg
              ><span class="notification-count" aria-label="2 unread messages">2</span></span
            ><span>Messages</span></a
          >
        </li>
      </ul>
    </nav>
  </body>
</html>
