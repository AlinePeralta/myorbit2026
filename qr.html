<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fcfdff" />
    <meta name="description" content="My Orbit 2026 — Future Explorers Academy" />
    <title>My QR · Future Explorers Academy</title>
    <link rel="icon" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/logo.png" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/bootstrap-grid.min.css" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/main.min.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body class="">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app theme-qr">
      <div class="shell">
        <header class="page-header">
          <a class="icon-button" href="index.html" aria-label="Go back"
            ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#back"></use></svg
          ></a>
          <div class="header-title"><h1>My QR</h1></div>
          <span aria-hidden="true"></span>
        </header>
        <main class="main reading" id="main">
          <section class="qr-card panel" aria-labelledby="qr-name">
            <img
              src="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/logo.png"
              alt="Future Explorers Academy"
              class="qr-logo"
              decoding="async"
            /><img
              src="assets/img/qr-reference.webp"
              alt="Access QR code"
              class="qr-code"
              decoding="async"
            />
            <h2 id="qr-name">Christopher Madariaga</h2>
            <p>Parent / Guardian</p>
            <p>Access Code: <span class="access">0687704371</span></p>
            <div class="qr-instructions">
              <p>Show this QR code at pick up and drop off for a quick and easy check in</p>
            </div>
          </section>
        </main>
      </div>
    </div>
    <nav class="navbar-bottom" aria-label="Main navigation">
      <ul>
        <li>
          <a class="nav-link" href="index.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#home"></use></svg></span
            ><span>Home</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="qr.html" aria-current="page"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#qr"></use></svg></span
            ><span>My QR</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="chat.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#chat"></use></svg
              ><span class="notification-count" aria-label="2 unread messages">2</span></span
            ><span>Messages</span></a
          >
        </li>
      </ul>
    </nav>
  </body>
</html>
