<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fcfdff" />
    <meta name="description" content="My Orbit 2026 — Future Explorers Academy" />
    <title>Classroom 1 · Future Explorers Academy</title>
    <link rel="icon" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/logo.png" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/bootstrap-grid.min.css" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/main.min.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body class="">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app theme-classroom">
      <div class="shell">
        <header class="page-header feed-header">
          <a class="icon-button" href="cameras.html" aria-label="Go back"
            ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#back"></use></svg
          ></a>
          <div class="header-title">
            <h1>Pre-K B-PreK-B1</h1>
            <p>Classroom 1</p>
          </div>
          <span class="live">LIVE</span>
        </header>
        <main class="main feed-grid" id="main">
          <figure class="feed-figure">
            <img
              src="assets/img/classroom-1.webp"
              alt="Classroom 1"
              class="feed-image"
              decoding="async"
            />
          </figure>
          <div>
            <aside class="feed-note" aria-labelledby="privacy-title">
              <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#video"></use></svg>
              <div>
                <h2 id="privacy-title">You are viewing a live classroom feed</h2>
                <p>
                  For the safety and privacy of all children, recording and screenshots are
                  disabled.
                </p>
              </div>
            </aside>
            <section class="location-card panel" aria-label="Classroom information">
              <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#pin"></use></svg>
              <div>
                <h2>Classroom 1</h2>
                <p>Pre-K B - PreK-B 1</p>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                  <span class="live">LIVE</span><span class="muted">Update in real time</span>
                </div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>
    <nav class="navbar-bottom" aria-label="Main navigation">
      <ul>
        <li>
          <a class="nav-link" href="index.html" aria-current="page"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#home"></use></svg></span
            ><span>Home</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="qr.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#qr"></use></svg></span
            ><span>My QR</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="chat.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#chat"></use></svg
              ><span class="notification-count" aria-label="2 unread messages">2</span></span
            ><span>Messages</span></a
          >
        </li>
      </ul>
    </nav>
  </body>
</html>
