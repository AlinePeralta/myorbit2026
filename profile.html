<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fcfdff" />
    <meta name="description" content="My Orbit 2026 — Future Explorers Academy" />
    <title>Emilia’s profile · Future Explorers Academy</title>
    <link rel="icon" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/assets/img/logo.png" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/bootstrap-grid.min.css" />
    <link rel="stylesheet" href="https://serti-static.s3.us-east-1.amazonaws.com/MyOrbit/css/main.min.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body class="family--single">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app theme-flows">
      <div class="shell">
        <main class="main child-profile" id="main">
          <header class="profile-hero">
            <a class="icon-button profile-back" href="index.html" aria-label="Back to home"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#back"></use></svg></a
            ><img
              data-child-avatar
              src="assets/img/emilia.webp"
              alt="Emilia Madariaga"
              class="avatar"
              decoding="async"
            />
            <h1 data-child-name>Emilia Madariaga</h1>
            <p data-child-group>Older 2s</p>
          </header>
          <div class="section-heading profile-date">
            <h2><time datetime="2025-09-22">Mon, Sep 22, 2025</time></h2>
            <button
              type="button"
              class="icon-button"
              data-action="activity-date"
              aria-disabled="true"
              aria-label="Choose date"
            >
              <svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#calendar"></use>
              </svg>
            </button>
          </div>
          <section class="teacher-assigned" aria-label="Assigned teacher">
            <img
              src="assets/img/christopher.webp"
              alt="Christopher Posada"
              class="avatar"
              decoding="async"
            />
            <div>
              <p>Teacher Assigned</p>
              <h2>Christopher Posada</h2>
            </div>
          </section>
          <nav class="quick-actions profile-actions" aria-label="Child information">
            <a class="quick-action" href="activities.html"
              ><span class="action-tile"
                ><svg class="icon" aria-hidden="true">
                  <use href="assets/icons.svg#puzzle"></use></svg></span
              ><strong>Activity</strong></a
            ><a class="quick-action" href="weekly-report.html"
              ><span class="action-tile"
                ><svg class="icon" aria-hidden="true">
                  <use href="assets/icons.svg#report"></use></svg></span
              ><strong>Weekly Report</strong></a
            ><a class="quick-action" href="cameras.html"
              ><span class="action-tile"
                ><svg class="icon" aria-hidden="true">
                  <use href="assets/icons.svg#video"></use></svg></span
              ><strong>Camera</strong></a
            ><a class="quick-action" href="meet-teacher.html"
              ><span class="action-tile"
                ><svg class="icon" aria-hidden="true">
                  <use href="assets/icons.svg#calendar"></use></svg></span
              ><strong>Meeting</strong></a
            >
          </nav>
          <section class="profile-content" aria-label="Activity photos and description">
            <div class="gallery-column">
              <div class="gallery" aria-roledescription="carousel" aria-label="Activity photos">
                <img
                  src="assets/img/activity-1.webp"
                  alt="Emilia exploring shapes with a classmate"
                  class="gallery-main"
                  decoding="async"
                /><button
                  class="icon-button gallery-control prev"
                  type="button"
                  data-gallery-step="-1"
                  aria-label="Previous photo"
                >
                  <svg class="icon" aria-hidden="true">
                    <use href="assets/icons.svg#back"></use>
                  </svg></button
                ><button
                  class="icon-button gallery-control next"
                  type="button"
                  data-gallery-step="1"
                  aria-label="Next photo"
                >
                  <svg class="icon" aria-hidden="true">
                    <use href="assets/icons.svg#chevron-right"></use>
                  </svg></button
                ><span class="gallery-count" aria-live="polite">1 / 3</span>
              </div>
              <div class="thumbnails" aria-label="Choose photo">
                <button
                  type="button"
                  data-gallery-index="0"
                  data-src="assets/img/activity-1.webp"
                  aria-label="Show photo 1"
                  aria-pressed="true"
                >
                  <img
                    src="assets/img/activity-1.webp"
                    alt="Activity photo 1"
                    class=""
                    decoding="async"
                  /></button
                ><button
                  type="button"
                  data-gallery-index="1"
                  data-src="assets/img/activity-2.webp"
                  aria-label="Show photo 2"
                  aria-pressed="false"
                >
                  <img
                    src="assets/img/activity-2.webp"
                    alt="Activity photo 2"
                    class=""
                    decoding="async"
                  /></button
                ><button
                  type="button"
                  data-gallery-index="2"
                  data-src="assets/img/activity-3.webp"
                  aria-label="Show photo 3"
                  aria-pressed="false"
                >
                  <img
                    src="assets/img/activity-3.webp"
                    alt="Activity photo 3"
                    class=""
                    decoding="async"
                  />
                </button>
              </div>
            </div>
            <div class="activity-description">
              <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#heart"></use></svg>
              <div>
                <h2>Exploring shapes!</h2>
                <p>
                  <span data-child-short>Emilia</span> worked on a drawing activity and practiced
                  different shapes today.
                </p>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <nav class="navbar-bottom" aria-label="Main navigation">
      <ul>
        <li>
          <a class="nav-link" href="index.html" aria-current="page"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#home"></use></svg></span
            ><span>Home</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="qr.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#qr"></use></svg></span
            ><span>My QR</span></a
          >
        </li>
        <li>
          <a class="nav-link" href="chat.html"
            ><span class="badged"
              ><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#chat"></use></svg
              ><span class="notification-count" aria-label="2 unread messages">2</span></span
            ><span>Messages</span></a
          >
        </li>
      </ul>
    </nav>

  </body>
</html>
